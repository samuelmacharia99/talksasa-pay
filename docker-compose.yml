# Local development stack. Production uses deploy/compose.prod.yml with
# secrets decrypted from the SOPS bundle (docs/runbooks/secrets.md).
name: talksasa-pay

x-app: &app
  build:
    context: .
    dockerfile: deploy/Dockerfile
  image: talksasa-pay:dev
  # Dev secrets are owned by your user with mode 0600; run as that user.
  user: "${UID:-1000}:${GID:-1000}"
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
    ports:
      - "127.0.0.1:${TSP_DEV_PG_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    secrets: [pg_superuser_password, pg_owner_password, pg_app_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talksasa_pay"]
      interval: 2s
      timeout: 3s
      retries: 30
    command: ["postgres", "-c", "log_min_duration_statement=500", "-c", "log_lock_waits=on", "-c", "timezone=UTC"]

  migrate:
    <<: *app
    command: ["migrate", "up"]
    environment:
      TSP_ENV: development
      TSP_MIGRATE_DATABASE_URL_FILE: /run/secrets/migrate_database_url
    secrets:
      - source: migrate_database_url_compose
        target: migrate_database_url
    restart: "no"

  api:
    <<: *app
    command: ["api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      TSP_ENV: development
      TSP_LOG_LEVEL: debug
      TSP_HTTP_ADDR: ":8088"
      TSP_METRICS_ADDR: ":9464"
      TSP_DATABASE_URL_FILE: /run/secrets/database_url
      TSP_MASTER_KEYS_FILE: /run/secrets/master_keys
      TSP_API_KEY_PEPPER_FILE: /run/secrets/api_key_pepper
    secrets:
      - source: database_url_compose
        target: database_url
      - master_keys
      - api_key_pepper
    ports:
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:9464:9464"
    healthcheck:
      test: ["CMD", "/talksasa-pay", "healthcheck", "--url", "http://127.0.0.1:8088/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  pgdata:

secrets:
  pg_superuser_password: { file: ./deploy/dev-secrets/pg_superuser_password }
  pg_owner_password: { file: ./deploy/dev-secrets/pg_owner_password }
  pg_app_password: { file: ./deploy/dev-secrets/pg_app_password }
  database_url_compose: { file: ./deploy/dev-secrets/database_url_compose }
  migrate_database_url_compose: { file: ./deploy/dev-secrets/migrate_database_url_compose }
  master_keys: { file: ./deploy/dev-secrets/master_keys }
  api_key_pepper: { file: ./deploy/dev-secrets/api_key_pepper }
