# Local development stack. Production uses deploy/compose.prod.yml with
# secrets decrypted from the SOPS bundle (docs/runbooks/secrets.md).
name: talksasa-pay

x-app: &app
  build:
    context: .
    dockerfile: deploy/Dockerfile
  image: talksasa-pay:dev
  # Dev secrets are owned by your user with mode 0600; run as that user.
  user: "${UID:-1000}:${GID:-1000}"
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  depends_on:
    postgres:
      condition: service_healthy

# Next.js frontends: same hardening as the Go containers. They hold no
# secrets; the admin app only forwards each staff member's session cookie.
x-web: &web
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  tmpfs:
    - /tmp
  depends_on:
    api:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
    ports:
      - "127.0.0.1:${TSP_DEV_PG_PORT:-54329}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
    secrets: [pg_superuser_password, pg_owner_password, pg_app_password]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d talksasa_pay"]
      interval: 2s
      timeout: 3s
      retries: 30
    command: ["postgres", "-c", "log_min_duration_statement=500", "-c", "log_lock_waits=on", "-c", "timezone=UTC"]

  migrate:
    <<: *app
    command: ["migrate", "up"]
    environment:
      TSP_ENV: development
      TSP_MIGRATE_DATABASE_URL_FILE: /run/secrets/migrate_database_url
    secrets:
      - source: migrate_database_url_compose
        target: migrate_database_url
    restart: "no"

  # In-memory Safaricom Daraja (internal/mpesa/mpesatest) so STK push, STK
  # query, callbacks and C2B work locally without the sandbox. The phone's
  # last digit picks the outcome (see the mpesatest package doc). Simulate a
  # paybill payment with:
  #   curl -X POST 127.0.0.1:8090/fake/c2b -d '{"bill_ref":"HOST-1042","amount":100}'
  fake-daraja:
    build:
      context: .
      dockerfile_inline: |
        # syntax=docker/dockerfile:1.7
        FROM golang:1.26-bookworm AS build
        WORKDIR /src
        COPY go.mod go.sum ./
        RUN --mount=type=cache,target=/go/pkg/mod go mod download
        COPY . .
        RUN --mount=type=cache,target=/go/pkg/mod --mount=type=cache,target=/root/.cache/go-build \
            CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /out/fakedaraja ./cmd/fakedaraja
        FROM gcr.io/distroless/static-debian12:nonroot
        COPY --from=build /out/fakedaraja /fakedaraja
        USER nonroot:nonroot
        EXPOSE 8090
        ENTRYPOINT ["/fakedaraja"]
    image: talksasa-pay-fake-daraja:dev
    user: "${UID:-1000}:${GID:-1000}"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      TSP_ENV: development
      TSP_FAKE_DARAJA_ADDR: ":8090"
      TSP_FAKE_DARAJA_CALLBACK_DELAY: "2s"
      # The fake checks the api/worker present these exact credentials.
      TSP_MPESA_CONSUMER_KEY_FILE: /run/secrets/mpesa_consumer_key
      TSP_MPESA_CONSUMER_SECRET_FILE: /run/secrets/mpesa_consumer_secret
      TSP_MPESA_PASSKEY_FILE: /run/secrets/mpesa_passkey
    secrets: [mpesa_consumer_key, mpesa_consumer_secret, mpesa_passkey]
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      default:
        ipv4_address: 172.30.10.12
    healthcheck:
      test: ["CMD", "/fakedaraja", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app
    command: ["api"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      fake-daraja:
        condition: service_healthy
    environment:
      TSP_ENV: development
      TSP_LOG_LEVEL: debug
      TSP_HTTP_ADDR: ":8088"
      TSP_METRICS_ADDR: ":9464"
      # Admin API: reachable only on the compose network (from the admin
      # Next.js server). Deliberately NOT in `ports` below.
      TSP_ADMIN_ADDR: ":8089"
      TSP_ADMIN_SETUP_BASE_URL: "http://127.0.0.1:3001/setup/"
      # Only the two Next.js servers may forward the end user's IP.
      TSP_TRUSTED_PROXIES: "172.30.10.20/32,172.30.10.21/32"
      # Safaricom's sandbox test paybill; production sets the real number.
      TSP_MPESA_PAYBILL: "174379"
      # M-Pesa against the fake-daraja service, which calls back the api's
      # public listener inside the compose network.
      TSP_MPESA_ENV: sandbox
      TSP_MPESA_BASE_URL: "http://fake-daraja:8090/"
      TSP_MPESA_SHORTCODE: "174379"
      TSP_MPESA_CALLBACK_BASE_URL: "http://api:8088/"
      TSP_MPESA_CONSUMER_KEY_FILE: /run/secrets/mpesa_consumer_key
      TSP_MPESA_CONSUMER_SECRET_FILE: /run/secrets/mpesa_consumer_secret
      TSP_MPESA_PASSKEY_FILE: /run/secrets/mpesa_passkey
      TSP_MPESA_CALLBACK_TOKEN_FILE: /run/secrets/mpesa_callback_token
      TSP_DATABASE_URL_FILE: /run/secrets/database_url
      TSP_MASTER_KEYS_FILE: /run/secrets/master_keys
      TSP_API_KEY_PEPPER_FILE: /run/secrets/api_key_pepper
    secrets:
      - source: database_url_compose
        target: database_url
      - master_keys
      - api_key_pepper
      - mpesa_consumer_key
      - mpesa_consumer_secret
      - mpesa_passkey
      - mpesa_callback_token
    ports:
      - "127.0.0.1:8088:8088"
      - "127.0.0.1:9464:9464"
    networks:
      default:
        ipv4_address: 172.30.10.10
    healthcheck:
      test: ["CMD", "/talksasa-pay", "healthcheck", "--url", "http://127.0.0.1:8088/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Background jobs: webhook delivery, payment request expiry, retention,
  # M-Pesa callback processing and STK status checks. No published ports; /healthz and /metrics stay inside the container.
  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment:
      TSP_ENV: development
      TSP_LOG_LEVEL: debug
      TSP_WORKER_HEALTH_ADDR: "127.0.0.1:9465"
      TSP_MPESA_PAYBILL: "174379"
      # M-Pesa against the fake-daraja service, which calls back the api's
      # public listener inside the compose network.
      TSP_MPESA_ENV: sandbox
      TSP_MPESA_BASE_URL: "http://fake-daraja:8090/"
      TSP_MPESA_SHORTCODE: "174379"
      TSP_MPESA_CALLBACK_BASE_URL: "http://api:8088/"
      TSP_MPESA_CONSUMER_KEY_FILE: /run/secrets/mpesa_consumer_key
      TSP_MPESA_CONSUMER_SECRET_FILE: /run/secrets/mpesa_consumer_secret
      TSP_MPESA_PASSKEY_FILE: /run/secrets/mpesa_passkey
      TSP_MPESA_CALLBACK_TOKEN_FILE: /run/secrets/mpesa_callback_token
      TSP_DATABASE_URL_FILE: /run/secrets/database_url
      TSP_MASTER_KEYS_FILE: /run/secrets/master_keys
      TSP_API_KEY_PEPPER_FILE: /run/secrets/api_key_pepper
    secrets:
      - source: database_url_compose
        target: database_url
      - master_keys
      - api_key_pepper
      - mpesa_consumer_key
      - mpesa_consumer_secret
      - mpesa_passkey
      - mpesa_callback_token
    networks:
      default:
        ipv4_address: 172.30.10.11
    # Running jobs get TSP_WORKER_SHUTDOWN_TIMEOUT (25s) to finish on stop.
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "/talksasa-pay", "healthcheck", "--url", "http://127.0.0.1:9465/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  admin:
    <<: *web
    build:
      context: ./web
      dockerfile: ../deploy/web.Dockerfile
      args: { APP: admin }
    image: talksasa-pay-admin:dev
    environment:
      TSP_ADMIN_API_URL: "http://172.30.10.10:8089/admin/v1"
      # Plain http on localhost in development only.
      TSP_ADMIN_INSECURE_COOKIES: "true"
      PORT: "3001"
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      default:
        ipv4_address: 172.30.10.20
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  pay:
    <<: *web
    build:
      context: ./web
      dockerfile: ../deploy/web.Dockerfile
      args: { APP: pay }
    image: talksasa-pay-page:dev
    environment:
      TSP_PUBLIC_API_URL: "http://172.30.10.10:8088/public/v1"
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      default:
        ipv4_address: 172.30.10.21
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.10.0/24

volumes:
  pgdata:

secrets:
  pg_superuser_password: { file: ./deploy/dev-secrets/pg_superuser_password }
  pg_owner_password: { file: ./deploy/dev-secrets/pg_owner_password }
  pg_app_password: { file: ./deploy/dev-secrets/pg_app_password }
  database_url_compose: { file: ./deploy/dev-secrets/database_url_compose }
  migrate_database_url_compose: { file: ./deploy/dev-secrets/migrate_database_url_compose }
  master_keys: { file: ./deploy/dev-secrets/master_keys }
  api_key_pepper: { file: ./deploy/dev-secrets/api_key_pepper }
  mpesa_consumer_key: { file: ./deploy/dev-secrets/mpesa_consumer_key }
  mpesa_consumer_secret: { file: ./deploy/dev-secrets/mpesa_consumer_secret }
  mpesa_passkey: { file: ./deploy/dev-secrets/mpesa_passkey }
  mpesa_callback_token: { file: ./deploy/dev-secrets/mpesa_callback_token }
