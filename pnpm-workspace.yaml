# The pnpm workspace root is the repository root (hosts that build one app
# from a subdirectory install from here); the code lives under web/.
packages:
  - web/apps/*
  - web/packages/*
  - web/e2e
# Supply-chain hardening: no install scripts except those explicitly allowed,
# and only versions published at least a day ago.
onlyBuiltDependencies:
  - sharp
  - unrs-resolver
minimumReleaseAge: 1440
