# Staging / production stack. Never run by hand: scripts/deploy.sh ships the
# images and this file to the host, and deploy/host/apply.sh starts it.
#
# Values come from two places on the host:
#   /etc/talksasa-pay/<env>.env      non-secret settings (see deploy/env.example)
#   /run/talksasa-pay/<env>/secrets/  secrets decrypted from secrets/<env>.enc.yaml
#                                     (tmpfs, mode 0400; never on persistent disk)
#
# Only Caddy publishes ports to the internet. The admin API (:8089), the Go
# public listener (:8088), Postgres and the Next.js servers stay on the
# internal network; metrics are bound to the host's loopback.
name: talksasa-pay-${TSP_ENV:?set TSP_ENV}

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

x-app: &app
  <<: *hardening
  image: talksasa-pay:${TSP_VERSION:?set TSP_VERSION}
  # distroless "nonroot"; apply.sh chowns the secret files to this uid.
  user: "65532:65532"
  depends_on:
    postgres:
      condition: service_healthy

x-web: &web
  <<: *hardening
  user: "1000:1000"
  tmpfs: [/tmp]
  depends_on:
    api:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    shm_size: 256m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_superuser_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Stable paths (not per release) so a deploy never restarts Postgres or Caddy.
      - ${TSP_SHARED_DIR:?}/postgres/init-roles.prod.sh:/docker-entrypoint-initdb.d/10-init-roles.sh:ro
      - ${TSP_PG_TLS_DIR:?}:/tls:ro
    secrets: [pg_superuser_password, pg_owner_password, pg_app_password]
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on
      - -c
      - timezone=UTC
    healthcheck:
      # TCP, so it only passes once the init scripts have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d talksasa_pay"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      default:
        ipv4_address: ${TSP_NET:-172.30.20}.5
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  # Run explicitly by apply.sh (`compose run --rm migrate`), never by `up`.
  migrate:
    <<: *app
    profiles: [migrate]
    restart: "no"
    command: ["migrate", "up"]
    environment:
      TSP_ENV: ${TSP_ENV}
      TSP_MIGRATE_DATABASE_URL_FILE: /run/secrets/migrate_database_url
    secrets: [migrate_database_url]
    networks:
      default:
        ipv4_address: ${TSP_NET:-172.30.20}.9

  api:
    <<: *app
    command: ["api"]
    environment:
      TSP_ENV: ${TSP_ENV}
      TSP_LOG_LEVEL: ${TSP_LOG_LEVEL:-info}
      TSP_HTTP_ADDR: ":8088"
      TSP_METRICS_ADDR: ":9464"
      TSP_ADMIN_ADDR: ":8089"
      TSP_ADMIN_SETUP_BASE_URL: "https://${TSP_ADMIN_DOMAIN:?}/setup/"
      # Rendered into pay_url; the worker must use the same value.
      TSP_PAY_BASE_URL: "https://${TSP_PAY_DOMAIN:?}/"
      # Caddy (product API callers) and the two Next.js servers may pass the
      # end user's IP. Nothing else can.
      TSP_TRUSTED_PROXIES: "${TSP_NET:-172.30.20}.2/32,${TSP_NET:-172.30.20}.20/32,${TSP_NET:-172.30.20}.21/32"
      TSP_MPESA_PAYBILL: ${TSP_MPESA_PAYBILL:?}
      # M-Pesa (Daraja). Empty TSP_MPESA_ENV = off: the mpesa_* secret files
      # are then placeholders apply.sh writes and the service never reads.
      TSP_MPESA_ENV: ${TSP_MPESA_ENV:-}
      TSP_MPESA_SHORTCODE: ${TSP_MPESA_SHORTCODE:-}
      TSP_MPESA_CALLBACK_BASE_URL: ${TSP_MPESA_CALLBACK_BASE_URL:-https://${TSP_API_DOMAIN:?}/}
      TSP_MPESA_CALLBACK_CIDRS: ${TSP_MPESA_CALLBACK_CIDRS:-}
      TSP_MPESA_CONSUMER_KEY_FILE: /run/secrets/mpesa_consumer_key
      TSP_MPESA_CONSUMER_SECRET_FILE: /run/secrets/mpesa_consumer_secret
      TSP_MPESA_PASSKEY_FILE: /run/secrets/mpesa_passkey
      TSP_MPESA_CALLBACK_TOKEN_FILE: /run/secrets/mpesa_callback_token
      TSP_DATABASE_URL_FILE: /run/secrets/database_url
      TSP_MASTER_KEYS_FILE: /run/secrets/master_keys
      TSP_API_KEY_PEPPER_FILE: /run/secrets/api_key_pepper
    secrets: [database_url, master_keys, api_key_pepper, mpesa_consumer_key, mpesa_consumer_secret, mpesa_passkey, mpesa_callback_token]
    ports:
      - "127.0.0.1:${TSP_METRICS_PORT:-9464}:9464"
    networks:
      default:
        ipv4_address: ${TSP_NET:-172.30.20}.10
    healthcheck:
      test: ["CMD", "/talksasa-pay", "healthcheck", "--url", "http://127.0.0.1:8088/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Background jobs: webhook delivery, payment request expiry, retention,
  # M-Pesa callback processing and STK status checks. Talks to Postgres and
  # outbound to product webhook URLs and Safaricom Daraja. Its
  # /healthz and /metrics listener is bound to the host's loopback only.
  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      TSP_ENV: ${TSP_ENV}
      TSP_LOG_LEVEL: ${TSP_LOG_LEVEL:-info}
      TSP_WORKER_HEALTH_ADDR: ":9465"
      TSP_PAY_BASE_URL: "https://${TSP_PAY_DOMAIN:?}/"
      TSP_ADMIN_SETUP_BASE_URL: "https://${TSP_ADMIN_DOMAIN:?}/setup/"
      TSP_MPESA_PAYBILL: ${TSP_MPESA_PAYBILL:?}
      # M-Pesa (Daraja). Empty TSP_MPESA_ENV = off: the mpesa_* secret files
      # are then placeholders apply.sh writes and the service never reads.
      TSP_MPESA_ENV: ${TSP_MPESA_ENV:-}
      TSP_MPESA_SHORTCODE: ${TSP_MPESA_SHORTCODE:-}
      TSP_MPESA_CALLBACK_BASE_URL: ${TSP_MPESA_CALLBACK_BASE_URL:-https://${TSP_API_DOMAIN:?}/}
      TSP_MPESA_CALLBACK_CIDRS: ${TSP_MPESA_CALLBACK_CIDRS:-}
      TSP_MPESA_CONSUMER_KEY_FILE: /run/secrets/mpesa_consumer_key
      TSP_MPESA_CONSUMER_SECRET_FILE: /run/secrets/mpesa_consumer_secret
      TSP_MPESA_PASSKEY_FILE: /run/secrets/mpesa_passkey
      TSP_MPESA_CALLBACK_TOKEN_FILE: /run/secrets/mpesa_callback_token
      TSP_DATABASE_URL_FILE: /run/secrets/database_url
      TSP_MASTER_KEYS_FILE: /run/secrets/master_keys
      TSP_API_KEY_PEPPER_FILE: /run/secrets/api_key_pepper
    secrets: [database_url, master_keys, api_key_pepper, mpesa_consumer_key, mpesa_consumer_secret, mpesa_passkey, mpesa_callback_token]
    ports:
      - "127.0.0.1:${TSP_WORKER_METRICS_PORT:-9465}:9465"
    networks:
      default:
        ipv4_address: ${TSP_NET:-172.30.20}.11
    # Running jobs get TSP_WORKER_SHUTDOWN_TIMEOUT (25s) to finish on stop.
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "/talksasa-pay", "healthcheck", "--url", "http://127.0.0.1:9465/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  admin:
    <<: *web
    image: talksasa-pay-admin:${TSP_VERSION}
    environment:
      NODE_ENV: production
      PORT: "3001"
      TSP_ADMIN_API_URL: "http://${TSP_NET:-172.30.20}.10:8089/admin/v1"
      TSP_TRUST_FORWARDED_FOR: "true"
      TSP_LOG_LEVEL: ${TSP_LOG_LEVEL:-info}
    networks:
      default:
        ipv4_address: ${TSP_NET:-172.30.20}.20
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  pay:
    <<: *web
    image: talksasa-pay-page:${TSP_VERSION}
    environment:
      NODE_ENV: production
      PORT: "3000"
      TSP_PUBLIC_API_URL: "http://${TSP_NET:-172.30.20}.10:8088/public/v1"
      TSP_TRUST_FORWARDED_FOR: "true"
      TSP_LOG_LEVEL: ${TSP_LOG_LEVEL:-info}
    networks:
      default:
        ipv4_address: ${TSP_NET:-172.30.20}.21
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  caddy:
    <<: *hardening
    image: caddy:2.10.2-alpine
    cap_add: ["NET_BIND_SERVICE"]
    depends_on:
      admin: { condition: service_healthy }
      pay: { condition: service_healthy }
    environment:
      TSP_PAY_DOMAIN: ${TSP_PAY_DOMAIN:?}
      TSP_ADMIN_DOMAIN: ${TSP_ADMIN_DOMAIN:?}
      TSP_API_DOMAIN: ${TSP_API_DOMAIN:?}
      TSP_ACME_EMAIL: ${TSP_ACME_EMAIL:?}
      TSP_ADMIN_ALLOW_CIDRS: ${TSP_ADMIN_ALLOW_CIDRS:?}
      TSP_NET: ${TSP_NET:-172.30.20}
    ports:
      - "${TSP_HTTP_PORT:-80}:80"
      - "${TSP_HTTPS_PORT:-443}:443"
      - "${TSP_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ${TSP_SHARED_DIR}/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs: [/tmp]
    networks:
      default:
        ipv4_address: ${TSP_NET:-172.30.20}.2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  default:
    ipam:
      config:
        - subnet: ${TSP_NET:-172.30.20}.0/24

volumes:
  pgdata:
  caddy_data:
  caddy_config:

secrets:
  pg_superuser_password: { file: "${TSP_SECRETS_DIR:?}/pg_superuser_password" }
  pg_owner_password: { file: "${TSP_SECRETS_DIR}/pg_owner_password" }
  pg_app_password: { file: "${TSP_SECRETS_DIR}/pg_app_password" }
  database_url: { file: "${TSP_SECRETS_DIR}/database_url" }
  migrate_database_url: { file: "${TSP_SECRETS_DIR}/migrate_database_url" }
  master_keys: { file: "${TSP_SECRETS_DIR}/master_keys" }
  api_key_pepper: { file: "${TSP_SECRETS_DIR}/api_key_pepper" }
  # Optional in the bundle while M-Pesa is off (apply.sh writes placeholders).
  mpesa_consumer_key: { file: "${TSP_SECRETS_DIR}/mpesa_consumer_key" }
  mpesa_consumer_secret: { file: "${TSP_SECRETS_DIR}/mpesa_consumer_secret" }
  mpesa_passkey: { file: "${TSP_SECRETS_DIR}/mpesa_passkey" }
  mpesa_callback_token: { file: "${TSP_SECRETS_DIR}/mpesa_callback_token" }
