version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - gosec
    - revive
    - bodyclose
    - errorlint
    - noctx
    - sqlclosecheck
    - rowserrcheck
    - misspell
    - unconvert
    - nolintlint
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gosec:
      excludes:
        - G115 # int conversions are range-checked by money/DB constraints
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    paths:
      - internal/store # generated by sqlc
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]
formatters:
  enable: [gofmt, goimports]
