openapi: 3.1.0
info:
  title: Talksasa Pay public pay-page API
  version: 1.0.0
  description: |
    Data for the hosted checkout page of one charge, plus one action:
    sending an M-Pesa payment prompt (STK push) for the charge's amount.
    Called server-side by the pay Next.js app, which forwards the visitor's
    IP in `X-Talksasa-Client-Ip` (trusted only from TSP_TRUSTED_PROXIES) for
    per-visitor rate limiting.

    The response deliberately carries no phone number, metadata or internal
    ids. Unknown, malformed and suspended-app tokens all return the same
    404.
servers:
  - url: /public/v1
paths:
  /pay/{token}:
    get:
      summary: The charge behind a hosted payment link
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, pattern: "^[a-z2-7]{52}$" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayPage" }
        "404":
          description: Not a valid payment link
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Too many requests
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
  /pay/{token}/stk:
    post:
      summary: Send an M-Pesa payment prompt to a phone for this charge
      description: |
        Always the charge's exact amount. Only pending charges can be
        prompted (409 `not_payable`). Rate limited per visitor, and only one
        prompt per charge can be live at a time (409 `stk_in_progress`). A
        failed prompt does not fail the charge: the customer can try again.
        The page then polls GET /pay/{token} for `status` and `stk_push`.
      parameters:
        - { name: token, in: path, required: true, schema: { type: string, pattern: "^[a-z2-7]{52}$" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, maxLength: 20, description: "07XXXXXXXX, 01XXXXXXXX, 2547XXXXXXXX or +2547XXXXXXXX" }
      responses:
        "202":
          description: Prompt sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayPageSTK" }
        "404":
          description: Not a valid payment link
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "409":
          description: "Not payable (not_payable: succeeded, in review, cancelled or expired), a prompt is already live (stk_in_progress) or amount above KES 250,000 (amount_too_large)"
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "422":
          description: Invalid phone number (validation_failed)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "429":
          description: Too many requests
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "502":
          description: Safaricom could not send the prompt (mpesa_error)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: M-Pesa prompts are not available (mpesa_unavailable)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
components:
  schemas:
    PayPageSTK:
      type: object
      description: The latest prompt for this charge, without ids or the phone number.
      required: [status, message, created_at]
      properties:
        status: { type: string, enum: [initiating, sent, succeeded, failed, needs_review] }
        message:
          type: [string, "null"]
          description: "Customer-facing reason when failed (e.g. 'You cancelled the prompt'); null otherwise"
        created_at: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        request_id: { type: string }
    PayPage:
      type: object
      required: [app_name, reference, description, currency, amount, status, payable, expires_at, succeeded_at, paybill, stk_available, stk_push]
      properties:
        app_name: { type: string, description: Who is collecting the money }
        reference: { type: string, description: "The app's reference (e.g. invoice number)" }
        description: { type: [string, "null"] }
        currency: { type: string, enum: [KES] }
        amount: { type: integer }
        status:
          type: string
          enum: [pending, needs_review, succeeded, expired, cancelled, reversed]
          description: "A pending charge past its expiry is shown as expired even before the expiry job runs."
        payable: { type: boolean, description: "True while a prompt may be sent (status pending)" }
        expires_at: { type: string, format: date-time }
        succeeded_at: { type: [string, "null"], format: date-time }
        paybill:
          description: Manual M-Pesa instructions while payable; null otherwise
          oneOf:
            - type: "null"
            - type: object
              required: [business_number, account_number]
              properties:
                business_number: { type: string }
                account_number: { type: string }
        stk_available: { type: boolean, description: "True when M-Pesa prompts can be sent for this charge (M-Pesa on, charge payable, amount <= KES 250,000)" }
        stk_push:
          description: The latest prompt for this charge in the last 15 minutes, if any
          oneOf:
            - $ref: "#/components/schemas/PayPageSTK"
            - { type: "null" }
