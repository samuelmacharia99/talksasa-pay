openapi: 3.1.0
info:
  title: Talksasa Pay admin API
  version: 1.0.0
  description: |
    Staff admin API, served on the internal admin listener (TSP_ADMIN_ADDR).
    Only the admin Next.js server calls it; browsers never do.

    Authentication: `Authorization: Bearer <session token>` (from POST /auth/mfa).
    The Next.js server forwards the end user's IP and user agent in
    `X-Talksasa-Client-Ip` / `X-Talksasa-Client-Ua`; they are trusted only from
    TSP_TRUSTED_PROXIES.

    Amounts are integer Kenya shillings. Phone numbers are always masked.
    Errors are RFC 9457 problem+json (`Problem`). Routes the gateway-core
    work has not implemented yet answer 501 `not_implemented`.
servers:
  - url: /admin/v1
security:
  - session: []
paths:
  /auth/login:
    post:
      security: []
      summary: Check email and password; returns a 5-minute 2FA challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Password correct; complete 2FA next
          content:
            application/json:
              schema:
                type: object
                required: [challenge, expires_at]
                properties:
                  challenge: { type: string }
                  expires_at: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/mfa:
    post:
      security: []
      summary: Exchange the challenge and a TOTP or recovery code for a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challenge, code]
              properties:
                challenge: { type: string }
                code: { type: string }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                type: object
                required: [session_token, expires_at, user]
                properties:
                  session_token: { type: string }
                  expires_at: { type: string, format: date-time }
                  user: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
  /auth/setup/{token}:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string } }
    get:
      security: []
      summary: Validate a setup link and start TOTP enrolment
      responses:
        "200":
          description: Setup details
          content:
            application/json:
              schema:
                type: object
                required: [email, name, expires_at, enrolment, totp_secret, otpauth_uri]
                properties:
                  email: { type: string }
                  name: { type: string }
                  expires_at: { type: string, format: date-time }
                  enrolment: { type: string, description: Opaque; post it back unchanged }
                  totp_secret: { type: string, description: Base32, for manual entry }
                  otpauth_uri: { type: string, description: Encode as a QR code }
        "404": { $ref: "#/components/responses/Problem" }
    post:
      security: []
      summary: Set the password, prove TOTP enrolment, activate the account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enrolment, password, code]
              properties:
                enrolment: { type: string }
                password: { type: string }
                code: { type: string }
      responses:
        "200":
          description: Activated; recovery codes are shown once
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes: { type: array, items: { type: string } }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /auth/me:
    get:
      summary: The signed-in staff member
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        "401": { $ref: "#/components/responses/Problem" }
  /auth/logout:
    post:
      summary: End this session
      responses:
        "204": { description: Signed out }
  /auth/password:
    post:
      summary: Change password (signs out every session)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, new_password]
              properties:
                current_password: { type: string }
                new_password: { type: string }
      responses:
        "204": { description: Changed }
        "401": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /dashboard:
    get:
      summary: Collections and queue counts
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Dashboard" } } } }
  /integrity:
    get:
      summary: Audit-chain check
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Integrity" } } } }
  /apps:
    get:
      summary: List apps
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/App" } }
    post:
      summary: Create an app (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, account_prefix]
              properties:
                name: { type: string }
                account_prefix: { type: string }
                webhook_url: { type: string }
      responses:
        "201":
          description: Created; the webhook secret is shown once
          content:
            application/json:
              schema:
                type: object
                required: [app, webhook_secret]
                properties:
                  app: { $ref: "#/components/schemas/App" }
                  webhook_secret: { type: string }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /apps/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: One app
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/App" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /apps/{id}/webhook-url:
    parameters: [{ $ref: "#/components/parameters/id" }]
    put:
      summary: Change the webhook URL (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [webhook_url]
              properties:
                webhook_url: { type: string, description: Empty clears it }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/App" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /apps/{id}/rotate-webhook-secret:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Replace the webhook signing secret (admin); shown once
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [webhook_secret]
                properties:
                  webhook_secret: { type: string }
  /apps/{id}/status:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Suspend or re-activate an app (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { type: string, enum: [active, suspended] }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/App" } } } }
  /apps/{id}/api-keys:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: List an app's API keys (never the secrets)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/APIKey" } }
    post:
      summary: Issue an API key (admin); the key is shown once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [label]
              properties:
                label: { type: string }
                expires_at: { type: [string, "null"], format: date-time }
      responses:
        "201":
          description: Issued
          content:
            application/json:
              schema:
                type: object
                required: [key, api_key]
                properties:
                  key: { $ref: "#/components/schemas/APIKey" }
                  api_key: { type: string }
  /apps/{id}/api-keys/{keyID}/revoke:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: keyID, in: path, required: true, schema: { type: string } }
    post:
      summary: Revoke an API key (admin)
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Problem" }
  /apps/{id}/api-keys/{keyID}/allowed-ips:
    parameters:
      - { $ref: "#/components/parameters/id" }
      - { name: keyID, in: path, required: true, schema: { type: string } }
    put:
      summary: Restrict an API key to IP addresses / CIDR ranges (admin); null or [] = any address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [allowed_ips]
              properties:
                allowed_ips: { type: [array, "null"], maxItems: 50, items: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/APIKey" } } } }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
  /webhook-deliveries:
    get:
      summary: Webhook deliveries, newest first
      parameters:
        - { $ref: "#/components/parameters/app_id" }
        - { name: status, in: query, schema: { type: string, enum: [pending, delivered, failed, skipped] } }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/WebhookDelivery" } }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
  /webhook-deliveries/{eventID}:
    parameters:
      - { name: eventID, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: One delivery with every attempt and the event body
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [delivery, attempts, event]
                properties:
                  delivery: { $ref: "#/components/schemas/WebhookDelivery" }
                  attempts: { type: array, items: { $ref: "#/components/schemas/WebhookAttempt" } }
                  event:
                    type: object
                    required: [id, type, created_at, data]
                    properties:
                      id: { type: string, format: uuid }
                      type: { type: string }
                      created_at: { type: string, format: date-time }
                      data: { type: object }
        "404": { $ref: "#/components/responses/Problem" }
  /webhook-deliveries/{eventID}/redeliver:
    parameters:
      - { name: eventID, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Queue a failed or skipped delivery again (admin)
      responses:
        "200": { description: Queued, content: { application/json: { schema: { $ref: "#/components/schemas/WebhookDelivery" } } } }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /charges:
    get:
      summary: List charges, newest first
      parameters:
        - { $ref: "#/components/parameters/app_id" }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/ChargeStatus" } }
        - { name: q, in: query, schema: { type: string }, description: "Reference, description or account number (typed loosely)" }
        - { name: from, in: query, schema: { type: string }, description: "Created from: YYYY-MM-DD (Nairobi) or RFC 3339" }
        - { name: to, in: query, schema: { type: string }, description: "Created to: YYYY-MM-DD inclusive (Nairobi) or RFC 3339" }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Charge" } }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
  /charges/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: One charge with its prompts and every transaction naming it
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ChargeDetail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /charges/{id}/stk-pushes:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: M-Pesa prompts sent for a charge, newest first
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/STKPush" } }
        "404": { $ref: "#/components/responses/Problem" }
  /transactions:
    get:
      summary: List ledger transactions
      parameters:
        - { $ref: "#/components/parameters/app_id" }
        - { name: charge_id, in: query, schema: { type: string, format: uuid } }
        - { name: channel, in: query, schema: { $ref: "#/components/schemas/Channel" } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/TxnStatus" } }
        - { name: direction, in: query, schema: { type: string, enum: [in, out] } }
        - { name: receipt, in: query, schema: { type: string } }
        - { name: phone, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string }, description: "YYYY-MM-DD (Nairobi) or RFC 3339" }
        - { name: to, in: query, schema: { type: string }, description: "YYYY-MM-DD inclusive (Nairobi) or RFC 3339" }
        - { name: unmatched, in: query, schema: { type: string, enum: ["true"] }, description: "Only succeeded incoming money with no app" }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
  /transactions/unmatched:
    get:
      summary: Unmatched payments (unknown account prefix), newest first
      description: |
        Succeeded incoming money that could not be routed to an app because
        the account number's prefix belongs to no app. Assign each one to an
        app with POST /transactions/{id}/assign.
      parameters:
        - { name: receipt, in: query, schema: { type: string } }
        - { name: phone, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string }, description: "YYYY-MM-DD (Nairobi) or RFC 3339" }
        - { name: to, in: query, schema: { type: string }, description: "YYYY-MM-DD inclusive (Nairobi) or RFC 3339" }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
                  next_cursor: { type: string }
        "400": { $ref: "#/components/responses/Problem" }
  /transactions/{id}:
    parameters: [{ $ref: "#/components/parameters/id" }]
    get:
      summary: One transaction with its status history
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TransactionDetail" } } } }
        "404": { $ref: "#/components/responses/Problem" }
  /transactions/{id}/resolve:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Confirm or fail an M-Pesa payment in needs_review (finance, admin)
      description: |
        Safaricom reported success for an STK push but never sent the receipt.
        Look the payment up on the M-Pesa portal, then either confirm it with
        its receipt (the transaction succeeds and its charge succeeds, or the
        app gets payment.received) or mark it failed (no money arrived; a
        charge in needs_review goes back to pending). Audited with the reason.
        409 `not_resolvable` if the transaction is not needs_review;
        409 `receipt_taken` if the receipt is already recorded elsewhere;
        409 `amount_mismatch` if Safaricom reported a different amount.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, reason]
              properties:
                action: { type: string, enum: [confirm, fail] }
                receipt: { type: string, maxLength: 64, description: "Required for confirm: the M-Pesa receipt, e.g. SKL4ABCD12" }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "200": { description: Resolved, content: { application/json: { schema: { $ref: "#/components/schemas/TransactionDetail" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /transactions/{id}/assign:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Assign an unmatched payment to an app (finance, admin)
      description: |
        Routes a succeeded payment with no app (unknown account prefix) to an
        app, which then gets `payment.received`. Set once: a payment that
        already has an app is 409 `already_assigned`. Audited with the reason.
        The app must exist (422 `validation_failed` on `app_id`); assigning
        to a suspended app is allowed (money rule 8) and the response says so
        in `app_status`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [app_id, reason]
              properties:
                app_id: { type: string, format: uuid }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "200": { description: Assigned, content: { application/json: { schema: { $ref: "#/components/schemas/TransactionDetail" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /transactions/{id}/reverse:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Record a reversal of a succeeded payment (admin)
      description: |
        Money rule 9: records a reversal transaction (kind `reversal`,
        direction `out`) for the payment's full amount. If the payment paid a
        charge, the charge becomes `reversed`. The app gets
        `transaction.reversed`. Admin only, with a reason, audited. An M-Pesa
        payment needs Safaricom's reversal receipt.
        409 `not_reversible` (not a succeeded incoming payment) or
        `already_reversed`; 409 `receipt_taken` if the reversal receipt is
        already recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500 }
                receipt: { type: string, maxLength: 64, description: "Safaricom's reversal receipt; required for M-Pesa payments" }
      responses:
        "200": { description: Reversed; the reversal transaction, content: { application/json: { schema: { $ref: "#/components/schemas/TransactionDetail" } } } }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /mpesa/callbacks:
    get:
      summary: Safaricom callbacks received, newest first (bodies are not listed)
      parameters:
        - { name: unprocessed, in: query, schema: { type: boolean }, description: "Only callbacks not yet processed (or failing)" }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MpesaCallback" } }
                  next_cursor: { type: string }
  /audit:
    get:
      summary: Audit log
      parameters:
        - { $ref: "#/components/parameters/app_id" }
        - { name: action, in: query, schema: { type: string }, description: Prefix, e.g. "app." }
        - { name: actor_id, in: query, schema: { type: string } }
        - { name: entity_id, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/cursor" }
        - { $ref: "#/components/parameters/limit" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  next_cursor: { type: string }
  /settings/mpesa:
    get:
      summary: The M-Pesa paybill settings in effect (no secret values) and where they come from
      description: |
        `source` is `database` (saved on the Settings page), `environment`
        (the TSP_MPESA_* fallback while nothing is saved) or `none` (M-Pesa
        is off). Credentials are write-only: only whether each is set and,
        for values of 12+ characters, its last 4 characters. Callback URLs
        show the secret callback token as `[TOKEN]`.
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/MpesaSettings" } } } }
    put:
      summary: Save the paybill settings (admin); audited, credentials encrypted
      description: |
        Credentials are optional on update: empty or absent keeps the stored
        value (all three are required the first time). When the saved or the
        new environment is production, `confirm` must be "production".
        Saving identical settings changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [environment, shortcode, callback_base_url]
              properties:
                environment: { type: string, enum: [sandbox, production] }
                shortcode: { type: string, description: The paybill (5-7 digits) }
                stk_shortcode: { type: [string, "null"], description: STK push BusinessShortCode; empty or null means the paybill }
                callback_base_url: { type: string, description: "Public base Safaricom calls, ending in /, e.g. https://pay.example.com/api/. Ignored when the deployment fixes it (callback_base_url_fixed); the admin panel derives it from its own public address." }
                consumer_key: { type: [string, "null"], writeOnly: true }
                consumer_secret: { type: [string, "null"], writeOnly: true }
                passkey: { type: [string, "null"], writeOnly: true }
                confirm: { type: [string, "null"], description: '"production" to save production settings' }
      responses:
        "200": { description: Saved, content: { application/json: { schema: { $ref: "#/components/schemas/MpesaSettings" } } } }
        "422": { $ref: "#/components/responses/Problem" }
  /settings/mpesa/test:
    post:
      summary: Ask Daraja for an OAuth token with the settings in effect (admin); the token is never returned
      responses:
        "200": { description: Tested (ok may be false), content: { application/json: { schema: { $ref: "#/components/schemas/MpesaSettingsTest" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /settings/mpesa/register-urls:
    post:
      summary: Register the paybill's C2B confirmation and validation URLs with Safaricom (admin); audited
      description: ResponseType Completed (a payment is never rejected). Production settings need `confirm` "production".
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                confirm: { type: [string, "null"] }
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema:
                type: object
                required: [registered_at, shortcode, confirmation_url, validation_url, response_type]
                properties:
                  registered_at: { type: string, format: date-time }
                  shortcode: { type: string }
                  confirmation_url: { type: string, description: "Token shown as [TOKEN]" }
                  validation_url: { type: string }
                  response_type: { type: string }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "502": { $ref: "#/components/responses/Problem" }
  /users:
    get:
      summary: Staff accounts (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
    post:
      summary: Invite a staff member (admin); the setup link is shown once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, name, role]
              properties:
                email: { type: string }
                name: { type: string }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201": { description: Invited, content: { application/json: { schema: { $ref: "#/components/schemas/Invitation" } } } }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
  /users/{id}/role:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Change a staff member's role (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/User" } } } }
        "409": { $ref: "#/components/responses/Problem" }
  /users/{id}/disable:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Disable a staff member and sign them out (admin)
      responses:
        "204": { description: Disabled }
        "409": { $ref: "#/components/responses/Problem" }
  /users/{id}/reset:
    parameters: [{ $ref: "#/components/parameters/id" }]
    post:
      summary: Wipe password and 2FA and issue a new setup link (admin)
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Invitation" } } } }
        "409": { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    session: { type: http, scheme: bearer }
  parameters:
    id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    app_id: { name: app_id, in: query, schema: { type: string, format: uuid } }
    cursor: { name: cursor, in: query, schema: { type: string } }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        request_id: { type: string }
    STKPush:
      type: object
      required: [id, source, status, amount, phone, checkout_request_id, result_code, result_desc, query_attempts, transaction_id, paid_transaction_id, confirm_blocked, created_at, completed_at]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [app, pay_page] }
        status: { type: string, enum: [initiating, sent, succeeded, failed, unknown] }
        amount: { type: integer }
        phone: { type: string, description: Masked }
        checkout_request_id: { type: [string, "null"] }
        result_code: { type: [string, "null"] }
        result_desc: { type: [string, "null"] }
        query_attempts: { type: integer }
        transaction_id: { type: string, format: uuid }
        paid_transaction_id: { type: [string, "null"], format: uuid, description: "Set when the payment arrived after the prompt was given up and was recorded on a new transaction" }
        confirm_blocked: { type: [string, "null"], enum: [amount_mismatch, receipt_taken, null], description: "Why staff cannot confirm this prompt with a receipt" }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    MpesaCallback:
      type: object
      required: [id, kind, remote_ip, received_at, processed_at, error, attempts, transaction_id]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [stk, c2b_confirmation] }
        remote_ip: { type: [string, "null"] }
        received_at: { type: string, format: date-time }
        processed_at: { type: [string, "null"], format: date-time }
        error: { type: [string, "null"] }
        attempts: { type: integer }
        transaction_id: { type: [string, "null"], format: uuid }
    Role: { type: string, enum: [viewer, finance, approver, admin] }
    ChargeStatus: { type: string, enum: [pending, needs_review, succeeded, expired, cancelled, reversed] }
    TxnStatus: { type: string, enum: [pending, succeeded, failed, cancelled, needs_review] }
    Channel: { type: string, enum: [mpesa_stk, mpesa_c2b, mpesa_b2c, manual] }
    Me:
      type: object
      required: [id, email, name, role, permissions, expires_at, idle_expires_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        permissions: { type: array, items: { type: string, enum: [read, apps.manage, users.manage, payments.resolve, payments.reverse, settings.manage] } }
        expires_at: { type: string, format: date-time }
        idle_expires_at: { type: string, format: date-time }
    User:
      type: object
      required: [id, email, name, role, status, last_login_at, created_by, created_at, disabled_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        status: { type: string, enum: [invited, active, disabled] }
        last_login_at: { type: [string, "null"], format: date-time }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        disabled_at: { type: [string, "null"], format: date-time }
    Invitation:
      type: object
      required: [user, setup_url, expires_at]
      properties:
        user: { $ref: "#/components/schemas/User" }
        setup_url: { type: string }
        expires_at: { type: string, format: date-time }
    App:
      type: object
      required: [id, name, account_prefix, webhook_url, status, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        account_prefix: { type: string }
        webhook_url: { type: string }
        status: { type: string, enum: [active, suspended] }
        created_at: { type: string, format: date-time }
    APIKey:
      type: object
      required: [key_id, label, created_by, created_at, expires_at, revoked_at, last_used_at]
      properties:
        key_id: { type: string }
        label: { type: string }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        last_used_at: { type: [string, "null"], format: date-time }
        allowed_ips: { type: [array, "null"], items: { type: string }, description: "null = any address" }
    WebhookDelivery:
      type: object
      required: [event_id, app_id, account_prefix, event_type, subject_type, subject_id, status, attempts, last_attempt_at, last_status_code, last_error, delivered_at, created_at]
      properties:
        event_id: { type: string, format: uuid }
        app_id: { type: string, format: uuid }
        account_prefix: { type: string }
        event_type: { type: string }
        subject_type: { type: string }
        subject_id: { type: string, format: uuid }
        status: { type: string, enum: [pending, delivered, failed, skipped] }
        attempts: { type: integer }
        last_attempt_at: { type: [string, "null"], format: date-time }
        last_status_code: { type: [integer, "null"] }
        last_error: { type: [string, "null"] }
        delivered_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
    WebhookAttempt:
      type: object
      required: [attempt, attempted_at, url_host, status_code, latency_ms, error, response_body]
      properties:
        attempt: { type: integer }
        attempted_at: { type: string, format: date-time }
        url_host: { type: string }
        status_code: { type: [integer, "null"] }
        latency_ms: { type: integer }
        error: { type: [string, "null"] }
        response_body: { type: [string, "null"], description: "First 1 KB of the receiver's response" }
    Charge:
      type: object
      required: [id, app_id, account_prefix, app_name, reference, description, amount, currency, account_number, phone, status,
        expires_at, succeeded_at, transaction_id, closed_at, created_at]
      properties:
        id: { type: string, format: uuid }
        app_id: { type: string, format: uuid }
        account_prefix: { type: string }
        app_name: { type: string }
        reference: { type: string }
        description: { type: [string, "null"] }
        amount: { type: integer }
        currency: { type: string, enum: [KES] }
        account_number: { type: string }
        phone: { type: [string, "null"], description: "Masked; the phone the app gave for the first prompt" }
        status: { $ref: "#/components/schemas/ChargeStatus" }
        expires_at: { type: string, format: date-time }
        succeeded_at: { type: [string, "null"], format: date-time }
        transaction_id: { type: [string, "null"], format: uuid, description: The payment that made the charge succeed }
        closed_at: { type: [string, "null"], format: date-time, description: When it expired or was cancelled }
        created_at: { type: string, format: date-time }
    ChargeDetail:
      allOf:
        - $ref: "#/components/schemas/Charge"
        - type: object
          required: [app_status, metadata, account_generated, updated_at, stk_pushes, transactions]
          properties:
            app_status: { type: string, enum: [active, suspended] }
            metadata: { type: [object, "null"], additionalProperties: true }
            account_generated: { type: boolean, description: "True when the gateway generated the account number" }
            updated_at: { type: string, format: date-time }
            stk_pushes: { type: array, items: { $ref: "#/components/schemas/STKPush" }, description: Newest first }
            transactions:
              type: array
              items: { $ref: "#/components/schemas/Transaction" }
              description: "Every transaction naming this charge, oldest first: the payment that paid it, failed prompts, duplicates and a reversal"
    Transaction:
      type: object
      required: [id, app_id, account_prefix, direction, kind, channel, status, amount, receipt, phone, account_number, charge_id,
        charge_reference, failure_reason, created_at, completed_at]
      properties:
        id: { type: string, format: uuid }
        app_id: { type: [string, "null"], format: uuid, description: "null = unmatched (no app)" }
        account_prefix: { type: [string, "null"] }
        direction: { type: string, enum: [in, out] }
        kind: { type: string, enum: [payment, refund, reversal, adjustment] }
        channel: { $ref: "#/components/schemas/Channel" }
        status: { $ref: "#/components/schemas/TxnStatus" }
        amount: { type: integer }
        receipt: { type: [string, "null"] }
        phone: { type: [string, "null"], description: Masked }
        account_number: { type: [string, "null"], description: "As typed at the paybill, or as sent with the prompt" }
        charge_id: { type: [string, "null"], format: uuid }
        charge_reference: { type: [string, "null"] }
        failure_reason: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    TransactionDetail:
      allOf:
        - $ref: "#/components/schemas/Transaction"
        - type: object
          required: [provider_request_id, reverses_transaction_id, failure_code, reason, created_by, occurred_at, updated_at, app_name, app_status, raw_payload, events]
          properties:
            provider_request_id: { type: [string, "null"] }
            reverses_transaction_id: { type: [string, "null"], format: uuid }
            failure_code: { type: [string, "null"] }
            reason: { type: [string, "null"] }
            created_by: { type: [string, "null"] }
            occurred_at: { type: [string, "null"], format: date-time }
            updated_at: { type: string, format: date-time }
            app_name: { type: [string, "null"] }
            app_status: { type: [string, "null"], enum: [active, suspended, null], description: "The app's status (null = unmatched); payments for a suspended app are still recorded and forwarded" }
            raw_payload: { description: Provider payload with phones masked }
            events:
              type: array
              items:
                type: object
                required: [from_status, to_status, actor, occurred_at]
                properties:
                  from_status: { type: [string, "null"] }
                  to_status: { type: string }
                  actor: { type: string }
                  occurred_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [id, occurred_at, actor_type, actor_id, action, entity_type, entity_id, app_id, account_prefix, details]
      properties:
        id: { type: integer }
        occurred_at: { type: string, format: date-time }
        actor_type: { type: string, enum: [system, admin, cli, app] }
        actor_id: { type: string }
        actor_name: { type: string }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: [string, "null"] }
        app_id: { type: [string, "null"], format: uuid }
        account_prefix: { type: [string, "null"] }
        details: { type: object, additionalProperties: true }
    Window:
      type: object
      required: [total, payments, by_app]
      properties:
        total: { type: integer }
        payments: { type: integer }
        by_app: { type: object, additionalProperties: { type: integer }, description: "app id -> KES; nil UUID = unassigned (unmatched)" }
    Dashboard:
      type: object
      required: [today, last_7_days, last_30_days, daily, apps, counts, timezone, generated_at]
      properties:
        today: { $ref: "#/components/schemas/Window" }
        last_7_days: { $ref: "#/components/schemas/Window" }
        last_30_days: { $ref: "#/components/schemas/Window" }
        daily:
          type: array
          items:
            type: object
            required: [day, total, payments, by_app]
            properties:
              day: { type: string, format: date }
              total: { type: integer }
              payments: { type: integer }
              by_app: { type: object, additionalProperties: { type: integer } }
        apps: { type: array, items: { $ref: "#/components/schemas/App" } }
        counts:
          type: object
          required: [charges_pending, charges_succeeded_today, charges_succeeded_today_amount, charges_needs_review,
            transactions_needs_review, unmatched_count, unmatched_amount, pending_transactions, unknown_stk_pushes,
            unprocessed_callbacks, inactive_app_payments]
          properties:
            charges_pending: { type: integer }
            charges_succeeded_today: { type: integer, description: Charges that succeeded since midnight Nairobi time }
            charges_succeeded_today_amount: { type: integer, description: KES }
            charges_needs_review: { type: integer }
            transactions_needs_review: { type: integer, description: M-Pesa payments staff must confirm or fail }
            unmatched_count: { type: integer, description: Succeeded incoming payments with no app (unknown prefix) }
            unmatched_amount: { type: integer, description: KES }
            pending_transactions: { type: integer }
            unknown_stk_pushes:
              type: integer
              description: STK pushes a status check reported as paid but no receipt arrived; their transactions are in needs_review until staff enter the receipt.
            unprocessed_callbacks:
              type: integer
              description: Safaricom callbacks still unprocessed 5 minutes after arrival, plus callbacks whose processing recorded an error in the last 7 days.
            inactive_app_payments:
              type: integer
              description: Successful incoming payments in the last 30 days for an app that is not active. The money was recorded and forwarded as normal; staff should follow up.
        timezone: { type: string }
        generated_at: { type: string, format: date-time }
    Integrity:
      type: object
      required: [audit_chain_ok, checked_at]
      properties:
        audit_chain_ok: { type: boolean }
        first_bad_audit_id: { type: integer }
        checked_at: { type: string, format: date-time }
    Credential:
      type: object
      required: [set, last4]
      properties:
        set: { type: boolean }
        last4: { type: [string, "null"], description: Only for values of 12+ characters }
    MpesaSettingsTest:
      type: object
      required: [ok, tested_at, message]
      properties:
        ok: { type: boolean }
        tested_at: { type: string, format: date-time }
        message: { type: [string, "null"], description: Why Safaricom refused (never secret) }
    MpesaSettings:
      type: object
      required: [source, environment, shortcode, stk_shortcode, callback_base_url, credentials, callback_token_set,
        callback_token_source, callback_base_url_fixed, callback_cidrs,
        callback_urls, version, updated_by, updated_by_name, updated_at, registration, last_test, ready, problem, environments, https_only]
      properties:
        source: { type: string, enum: [database, environment, none] }
        environment: { type: [string, "null"], enum: [sandbox, production, null] }
        shortcode: { type: [string, "null"] }
        stk_shortcode: { type: [string, "null"], description: null when STK uses the paybill }
        callback_base_url: { type: [string, "null"] }
        credentials:
          type: object
          required: [consumer_key, consumer_secret, passkey]
          properties:
            consumer_key: { $ref: "#/components/schemas/Credential" }
            consumer_secret: { $ref: "#/components/schemas/Credential" }
            passkey: { $ref: "#/components/schemas/Credential" }
        callback_token_set: { type: boolean, description: A callback token is in effect }
        callback_token_source:
          type: [string, "null"]
          enum: [deployment, generated, null]
          description: >-
            deployment = TSP_MPESA_CALLBACK_TOKEN; generated = made by the gateway on the first save and
            stored encrypted with the settings; null = none yet (the next save generates one)
        callback_base_url_fixed:
          type: boolean
          description: TSP_MPESA_CALLBACK_BASE_URL is set, so saves use it and ignore callback_base_url
        callback_cidrs: { type: integer, description: Networks in TSP_MPESA_CALLBACK_CIDRS }
        callback_urls:
          type: [object, "null"]
          required: [stk, confirmation, validation]
          properties:
            stk: { type: string }
            confirmation: { type: string }
            validation: { type: string }
        version: { type: integer }
        updated_by: { type: [string, "null"] }
        updated_by_name: { type: [string, "null"] }
        updated_at: { type: [string, "null"], format: date-time }
        registration:
          type: [object, "null"]
          required: [registered_at, registered_by, registered_by_name, confirmation_url, shortcode, current]
          properties:
            registered_at: { type: string, format: date-time }
            registered_by: { type: string }
            registered_by_name: { type: [string, "null"] }
            confirmation_url: { type: string }
            shortcode: { type: string }
            current: { type: boolean, description: For today's paybill and confirmation URL }
        last_test:
          type: [object, "null"]
          required: [ok, tested_at]
          properties:
            ok: { type: boolean }
            tested_at: { type: string, format: date-time }
        ready: { type: boolean, description: Prompts can be sent with these settings }
        problem: { type: [string, "null"] }
        environments: { type: array, items: { type: string, enum: [sandbox, production] }, description: What this deployment may save }
        https_only: { type: boolean }
