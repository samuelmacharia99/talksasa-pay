openapi: 3.1.0
info:
  title: Talksasa Pay product integration API
  version: "2026-11-24"
  description: |
    The API Talksasa products (Cloud Hosting, ISP Billing, ...) use to collect
    money through the single Talksasa M-Pesa paybill.

    **Authentication.** `Authorization: Bearer tsp_live_...` (or `tsp_test_`
    outside production). Every request is scoped to the key's product; there
    is no way to name another product. A key may be restricted to an IP
    allow-list (403 `ip_not_allowed` otherwise).

    **Money.** Amounts are integer Kenyan shillings (KES). There are no
    decimals. Products can request and read money; they can never record,
    move or refund it.

    **Idempotency.** Every write is safe to retry:
    `PUT /payers/{external_ref}` is an upsert; `POST /payment-requests`
    requires an `Idempotency-Key` header (same key + same body returns the
    original request with 200; same key + different body is 409
    `idempotency_conflict`); cancel is a no-op on an already-cancelled
    request.

    **M-Pesa prompts (STK push).** `POST /payment-requests/{id}/stk-push`
    sends a payment prompt to the customer's phone for the request's full
    outstanding balance. A 202 only means the prompt was sent; the money is
    confirmed by the `payment_request.paid` / `transaction.allocated` events
    (and `stk_push.*` events report the prompt's own fate). A request is
    only ever marked paid once Safaricom has confirmed it with an M-Pesa
    receipt.

    **Events.** Every change is delivered as a signed webhook AND is
    available from `GET /events`, a gap-free feed. Webhooks are at least once
    and may arrive out of order: de-duplicate by event `id`, and when in
    doubt re-read the resource or the feed.

    **Errors** are RFC 9457 `application/problem+json` with a stable `code`.
    `429` and `503` carry `Retry-After`; back off and retry. `503 busy` and
    `503 overloaded` mean nothing was changed. `503 timeout` means the
    outcome is unknown: retry with the SAME Idempotency-Key (or re-read), never
    with a new one. Quote
    `request_id` (also in the `X-Request-Id` header) when asking for help.
servers:
  - url: /v1
security:
  - apiKey: []
paths:
  /whoami:
    get:
      operationId: whoami
      summary: The product this key belongs to
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WhoAmI" }
        default: { $ref: "#/components/responses/Problem" }

  /payers/{external_ref}:
    parameters:
      - $ref: "#/components/parameters/ExternalRef"
    put:
      operationId: upsertPayer
      summary: Create or update a payer (your customer), keyed by your own id
      description: |
        Idempotent. Creating a payer assigns its permanent M-Pesa account
        number (e.g. `HOST-1042`), which the customer types as the paybill
        "Account number". Phones replace the stored list (first = primary).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayerInput" }
      responses:
        "200":
          description: Updated (or unchanged)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payer" }
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payer" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      operationId: getPayer
      summary: A payer, including its credit balance
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payer" }
        default: { $ref: "#/components/responses/Problem" }

  /payment-requests:
    post:
      operationId: createPaymentRequest
      summary: Ask a payer to pay an amount (an invoice, a renewal, ...)
      description: |
        Any credit the payer already holds is applied immediately, so the
        returned request may already be `partially_paid` or `paid`.
        `reference` is your invoice number: only one open/partially-paid
        request per reference may exist (409 `duplicate_reference`).
        Amounts can't be changed later: cancel and create a new request.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentRequestInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRequest" }
        "200":
          description: Replay of an earlier identical request (same Idempotency-Key)
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ["true"] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRequest" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      operationId: listPaymentRequests
      summary: Payment requests, newest first
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/PaymentRequestStatus" } }
        - { name: reference, in: query, schema: { type: string, maxLength: 128 } }
        - { name: payer, in: query, description: Payer external_ref, schema: { type: string, maxLength: 128 } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/PaymentRequest" } }
                  next_cursor: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Problem" }

  /payment-requests/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getPaymentRequest
      summary: One payment request
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRequest" }
        default: { $ref: "#/components/responses/Problem" }

  /payment-requests/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: cancelPaymentRequest
      summary: Cancel an open request on which nothing has been paid
      description: |
        Idempotent: cancelling an already-cancelled request returns it with
        200. A request with any money on it can't be cancelled (409
        `not_cancellable`); talk to Talksasa finance.
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRequest" }
        default: { $ref: "#/components/responses/Problem" }

  /transactions:
    get:
      operationId: listTransactions
      summary: Money received (and reversed) for your payers, newest first
      parameters:
        - { name: payer, in: query, description: Payer external_ref, schema: { type: string, maxLength: 128 } }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
                  next_cursor: { type: [string, "null"] }
        default: { $ref: "#/components/responses/Problem" }

  /transactions/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getTransaction
      summary: One transaction and where its money went
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transaction" }
        default: { $ref: "#/components/responses/Problem" }

  /events:
    get:
      operationId: listEvents
      summary: Gap-free feed of every event, oldest first
      description: |
        Store `next_cursor` after processing a page and pass it as `after`
        next time. The feed never skips an event, even one whose transaction
        committed late, so polling it is a complete alternative (or backstop)
        to webhooks. Start with no `after` to read from the beginning.
      parameters:
        - { name: after, in: query, schema: { type: string, maxLength: 200 } }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, has_more]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Event" } }
                  next_cursor: { type: [string, "null"], description: "Pass as `after`; null when data is empty (keep your previous cursor)." }
                  has_more: { type: boolean }
        default: { $ref: "#/components/responses/Problem" }

  /payment-requests/{id}/stk-push:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      operationId: sendSTKPush
      summary: Send an M-Pesa payment prompt for the request's outstanding balance
      description: |
        Asks Safaricom to show "Pay KES <outstanding> to Talksasa" on the
        customer's phone. The amount is always the full outstanding balance
        (at most KES 250,000; larger balances get 409 `amount_too_large` and
        must be paid by paybill). Only one prompt per request can be live at
        a time (409 `stk_in_progress` with the live push's id in `detail`).

        The response is 202 with the push. Its outcome arrives as events:
        `stk_push.sent` → then `stk_push.succeeded` with `payment_request.paid`
        (or `.partially_paid`) and `transaction.allocated`, or
        `stk_push.failed` (`result_code` / `result_desc`: cancelled by the
        customer, timed out, insufficient funds, wrong PIN...). If Safaricom
        never calls back, Talksasa checks with Safaricom after about a minute;
        a success without a receipt becomes `stk_push.needs_review` while staff
        confirm it — do NOT treat that as paid.

        Requires an `Idempotency-Key`: the same key returns the same push
        (200, `Idempotent-Replayed: true`); the same key with a different
        phone is 409 `idempotency_conflict`. On `503 timeout` retry with the
        SAME key: a new key could send the customer a second prompt.

        503 `mpesa_unavailable`: M-Pesa is not enabled in this environment.
        502 `mpesa_error`: Safaricom refused or failed to send the prompt
        (the push is returned as `failed` in the problem's `detail`; nothing
        was charged). Ask the customer to pay by paybill or try again later.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/STKPushInput" }
      responses:
        "202":
          description: Prompt sent (or being sent) to the phone
          content:
            application/json:
              schema: { $ref: "#/components/schemas/STKPush" }
        "200":
          description: Replay of an earlier identical request (same Idempotency-Key)
          headers:
            Idempotent-Replayed: { schema: { type: string, enum: ["true"] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/STKPush" }
        default: { $ref: "#/components/responses/Problem" }

  /stk-pushes/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      operationId: getSTKPush
      summary: One STK push
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/STKPush" }
        default: { $ref: "#/components/responses/Problem" }

webhooks:
  event:
    post:
      summary: An event, delivered to the product's webhook URL
      description: |
        Headers:
          - `Talksasa-Event-Id`: the event id (de-duplicate on it)
          - `Talksasa-Event-Type`
          - `Talksasa-Signature: t=<unix seconds>,v1=<hex>[,v1=<hex>]` where
            `v1 = HMAC-SHA256(webhook_secret, "<t>.<raw body>")`. Accept if
            ANY v1 matches (two appear for 24 h after a secret rotation) and
            `|now - t| <= 300` seconds. Compare in constant time.
        Respond 2xx within 10 s. Anything else (or a timeout) is retried
        with backoff for about 3 days. Process asynchronously if slow.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Event" }
      responses:
        "200": { description: Accepted }

components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: "Product API key: tsp_live_<key id>_<secret> (tsp_test_ outside production)."
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExternalRef:
      name: external_ref
      in: path
      required: true
      description: Your own customer id (1-128 characters, URL-encoded).
      schema: { type: string, minLength: 1, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique per logical request (e.g. a UUID, or "invoice-123-v1"). Kept forever.
      schema: { type: string, minLength: 1, maxLength: 255 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
  responses:
    Problem:
      description: Error
      headers:
        Retry-After: { schema: { type: integer }, description: "Seconds; on 429 and 503" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: |
            Stable machine-readable code: unauthorized, ip_not_allowed,
            product_suspended, rate_limited, overloaded, busy, timeout, not_found,
            validation_failed, invalid_json, unsupported_media_type,
            idempotency_key_required, idempotency_conflict,
            duplicate_reference, payer_closed, not_cancellable,
            not_payable, amount_too_large, stk_in_progress,
            mpesa_unavailable, mpesa_error,
            payload_too_large, internal_error.
        request_id: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    WhoAmI:
      type: object
      required: [product_id, product_name, account_prefix, key_id]
      properties:
        product_id: { type: string, format: uuid }
        product_name: { type: string }
        account_prefix: { type: string }
        key_id: { type: string }
    PayerInput:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: [string, "null"], maxLength: 254 }
        phones:
          type: array
          maxItems: 5
          items: { type: string, description: "Kenyan mobile, any common format (0712..., +254712..., 254712...)" }
    Payer:
      type: object
      required: [object, id, external_ref, account_number, display_name, email, phones, status, credit_balance, created_at, updated_at]
      properties:
        object: { type: string, const: payer }
        id: { type: string, format: uuid }
        external_ref: { type: string }
        account_number: { type: string, description: "What the customer types as the M-Pesa account number, e.g. HOST-1042" }
        display_name: { type: string }
        email: { type: [string, "null"] }
        phones: { type: array, items: { type: string }, description: Masked }
        status: { type: string, enum: [active, closed] }
        credit_balance: { type: integer, description: "KES overpaid and not yet applied; used automatically on the next request" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PaymentRequestInput:
      type: object
      additionalProperties: false
      required: [payer, reference, description, amount]
      properties:
        payer: { type: string, minLength: 1, maxLength: 128, description: "Payer external_ref (PUT the payer first)" }
        reference: { type: string, minLength: 1, maxLength: 128, description: Your invoice number }
        description: { type: string, minLength: 1, maxLength: 500 }
        amount: { type: integer, minimum: 1, maximum: 1000000000, description: KES }
        expires_at: { type: [string, "null"], format: date-time, description: "Optional, within 1 year. Only untouched requests expire." }
    PaymentRequestStatus:
      type: string
      enum: [open, partially_paid, paid, cancelled, expired]
    PayerRef:
      type: object
      required: [external_ref, account_number]
      properties:
        external_ref: { type: string }
        account_number: { type: string }
    PaymentRequest:
      type: object
      required: [object, id, reference, description, currency, amount, amount_paid, outstanding, status, payer, pay_url, paybill, expires_at, created_at, updated_at, paid_at, closed_at]
      properties:
        object: { type: string, const: payment_request }
        id: { type: string, format: uuid }
        reference: { type: string }
        description: { type: string }
        currency: { type: string, enum: [KES] }
        amount: { type: integer }
        amount_paid: { type: integer }
        outstanding: { type: integer }
        status: { $ref: "#/components/schemas/PaymentRequestStatus" }
        payer: { $ref: "#/components/schemas/PayerRef" }
        pay_url: { type: string, format: uri, description: "Hosted pay page to send the customer" }
        paybill:
          type: [object, "null"]
          description: Manual M-Pesa instructions; null once the request is closed
          required: [business_number, account_number]
          properties:
            business_number: { type: string }
            account_number: { type: string }
        expires_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        paid_at: { type: [string, "null"], format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
    Transaction:
      type: object
      required: [object, id, kind, direction, channel, status, amount, currency, receipt, phone, payer, payment_request_id, reverses_transaction_id, allocations, occurred_at, created_at, completed_at]
      properties:
        object: { type: string, const: transaction }
        id: { type: string, format: uuid }
        kind: { type: string, enum: [payment, refund, reversal, adjustment] }
        direction: { type: string, enum: [in, out] }
        channel: { type: string, enum: [mpesa_stk, mpesa_c2b, mpesa_b2c, manual] }
        status: { type: string, enum: [pending, succeeded, failed, cancelled, needs_review] }
        amount: { type: integer }
        currency: { type: string, enum: [KES] }
        receipt: { type: [string, "null"], description: M-Pesa receipt number }
        phone: { type: [string, "null"], description: Masked }
        payer: { oneOf: [{ $ref: "#/components/schemas/PayerRef" }, { type: "null" }] }
        payment_request_id: { type: [string, "null"], format: uuid }
        reverses_transaction_id: { type: [string, "null"], format: uuid }
        allocations:
          type: array
          items:
            type: object
            required: [payment_request_id, amount, kind]
            properties:
              payment_request_id: { type: [string, "null"], format: uuid, description: "null = payer credit balance" }
              amount: { type: integer, description: "Negative on reversals" }
              kind: { type: string, enum: [payment, credit_application, reversal] }
        occurred_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    STKPushInput:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone:
          type: string
          description: "Safaricom number to prompt: 07XXXXXXXX, 01XXXXXXXX, 2547XXXXXXXX or +2547XXXXXXXX"
          maxLength: 20
    STKPush:
      type: object
      required: [object, id, payment_request_id, transaction_id, status, amount, phone, checkout_request_id, result_code, result_desc, created_at, updated_at, completed_at]
      properties:
        object: { type: string, const: stk_push }
        id: { type: string, format: uuid }
        payment_request_id: { type: string, format: uuid }
        transaction_id: { type: string, format: uuid, description: "The M-Pesa transaction this push will complete (pending until Safaricom answers)" }
        status:
          type: string
          enum: [initiating, sent, succeeded, failed, needs_review]
          description: |
            initiating: being sent to Safaricom. sent: on the customer's phone.
            succeeded: paid (receipt recorded). failed: see result_code/result_desc.
            needs_review: Safaricom reported success without a receipt; staff
            are confirming. Not paid until payment_request.paid arrives.
        amount: { type: integer }
        phone: { type: string, description: Masked }
        checkout_request_id: { type: [string, "null"], description: "Safaricom's CheckoutRequestID (quote it to support)" }
        result_code: { type: [string, "null"], description: "Safaricom result code, e.g. 1032 = cancelled by the customer, 1037 = phone unreachable, 1 = insufficient funds, 2001 = wrong PIN" }
        result_desc: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    CreditChange:
      type: object
      required: [payer, delta, credit_balance, transaction_id]
      properties:
        payer: { $ref: "#/components/schemas/PayerRef" }
        delta: { type: integer }
        credit_balance: { type: integer }
        transaction_id: { type: [string, "null"], format: uuid }
    Event:
      type: object
      required: [object, id, type, api_version, created_at, data]
      properties:
        object: { type: string, const: event }
        id: { type: string, format: uuid }
        type:
          type: string
          enum:
            - payment_request.created
            - payment_request.partially_paid
            - payment_request.paid
            - payment_request.reopened
            - payment_request.cancelled
            - payment_request.expired
            - transaction.allocated
            - transaction.reversed
            - payer.credit_changed
            - stk_push.sent
            - stk_push.succeeded
            - stk_push.failed
            - stk_push.needs_review
        api_version: { type: string }
        created_at: { type: string, format: date-time }
        data:
          description: "payment_request.* -> PaymentRequest; transaction.* -> Transaction; payer.credit_changed -> CreditChange; stk_push.* -> STKPush (state at the time of the event)"
          oneOf:
            - $ref: "#/components/schemas/PaymentRequest"
            - $ref: "#/components/schemas/Transaction"
            - $ref: "#/components/schemas/CreditChange"
            - $ref: "#/components/schemas/STKPush"
